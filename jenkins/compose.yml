services:
  jenkins:
    build: .
    container_name: devsecops-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50000:50000"
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ci]
  registry:
    image: registry:2
    container_name: devsecops-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    networks: [ci]
volumes:
  jenkins_home:
networks:
  ci:
